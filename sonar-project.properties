sonar.projectKey=hendrykcosta75_baisync
sonar.organization=hendrykcosta75
sonar.projectName=Inertial Eclipse

# Fontes analisadas
sonar.sources=backend/src,frontend/app,frontend/components,frontend/store,frontend/lib,frontend/types

# Exclusões: build artifacts, testes, migrations, node_modules
sonar.exclusions=\
  **/target/**,\
  **/node_modules/**,\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/*.test.tsx,\
  backend/migrations/**,\
  backend/src/bin/**

# Testes
sonar.tests=frontend/tests,backend/tests
sonar.test.exclusions=**/target/**,**/node_modules/**

# Cobertura (gerada pelo vitest com --coverage)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
