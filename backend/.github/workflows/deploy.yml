name: Backend CI/CD

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
  pull_request:
    branches: [master]
    paths:
      - 'backend/**'

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      cassandra:
        image: cassandra:5.0
        ports:
          - 9042:9042
        options: >-
          --health-cmd "cqlsh -e 'DESCRIBE KEYSPACES'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Run unit tests
        working-directory: backend
        run: cargo test --lib
      - name: Run integration tests
        working-directory: backend
        env:
          DATABASE_URL: "127.0.0.1:9042"
          JWT_SECRET: "ci-test-secret-key"
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          SMTP_HOST: "localhost"
          SMTP_PORT: "587"
          SMTP_USER: "test"
          SMTP_PASS: "test"
          SMTP_FROM: "test@test.com"
          BAILEYS_URL: "http://localhost:3025"
          BAILEYS_API_KEY: "test-key"
          BAISYNC_API_KEY: "test-key"
          ADMIN_USER: "admin"
          ADMIN_PASSWORD: "admin"
        run: cargo test --test '*'

  deploy:
    name: Deploy Backend
    needs: [test]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: enki10/intertial-codebase:backend-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /data/coolify/services/t0koswoc4w8ccosg880ogckg
            docker compose pull backend baileys
            docker compose up -d backend baileys --no-deps
            docker image prune -f
