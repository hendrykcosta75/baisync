# Version-bump PRs are intentionally disabled. CI/CD (.github/workflows/ci-cd.yml)
# runs `cargo audit --deny warnings` and `yarn audit --level moderate` on every
# push + PR, plus pre-push hooks (lefthook.yml). That is the gate — Dependabot
# does not need to spam version-bump PRs alongside it.
#
# Security advisories are still surfaced via GitHub's repo-level Dependabot
# alerts (Settings → Code security → Dependabot alerts), which run independent
# of this file. They post to the Security tab; CI fails them on push/PR.
#
# `github-actions` updates stay on a slow cadence so workflow-action versions
# (a smaller surface than app deps) don't drift indefinitely.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
