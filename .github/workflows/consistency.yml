name: Consistency Checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  consistency:
    name: Cross-System Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install consistency test dependencies
        working-directory: tests/consistency
        run: npm install
      - name: Run consistency checks
        run: bash tests/consistency/check.sh
